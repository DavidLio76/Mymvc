name: Build and Push Docker Image

# 設定觸發條件：當 main 分支有程式碼被 push 進來時執行
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # 賦予這個 Action 寫入 Packages 的權限（GHCR 不需要另外填 Token）
    permissions:
      contents: read
      packages: write

    steps:
    # 1. 檢出（Checkout）程式碼
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 登入到 GitHub Container Registry (GHCR)
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 3. 轉為小寫格式（避免 GitHub 帳號或儲存庫名稱有大寫導致 Docker 報錯）
    - name: Downcase repo name
      run: |
        echo "IMAGE_NAME=ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

    # 4. 打包並推送 Docker 映像檔
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # 標籤設為 latest（最新版）
        tags: ${{ env.IMAGE_NAME }}:latest