name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
    # 1. 檢出程式碼（升級至 v4，並強制使用 Node24 避免警告）
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 登入到 GitHub Container Registry
    # 使用新版 v3，並明確指定用小寫儲存庫名稱避免變數抓取失敗
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 3. 核心修正：強制轉換大寫為小寫，並提供保底的映像檔路徑
    - name: Downcase repo name
      run: |
        echo "IMAGE_NAME=ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

    # 4. 打包並推送 Docker 映像檔
    # 升級到 v6，並加入解決 Node20 警告的環境變數
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      with:
        context: .
        push: true
        tags: ${{ env.IMAGE_NAME }}:latest
